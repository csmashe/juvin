# CI is gated so it does not burn Actions minutes on every push while a pull request is
# still going through code review. It runs when:
#   - a commit lands on main (merges always build);
#   - a pull request carries the "ci" label (add the label from the PR sidebar when review
#     is done; later pushes keep running while the label stays on, remove it to pause);
#   - someone presses "Run workflow" on the Actions tab (workflow_dispatch).
# Jobs: build and test on Linux, Windows, and macOS; extension, which builds, tests, and lints
# the browser extension; CodeQL; package-linux, which builds the
# Linux packages and smoke-tests them in containers; and package-windows, which builds the
# installer and smoke-tests a silent install (release-linux.yml and release-windows.yml publish
# them on a tag).
# To reuse in another repository: copy this file, create a "ci" label there
# (gh label create ci --color 0E8A16 --description "Run CI on this pull request"),
# and adjust the solution name in the three dotnet steps.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - labeled
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pull request events only run while the "ci" label is present; push and manual runs always do.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Juvin.slnx

      - name: Build
        run: dotnet build Juvin.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Juvin.slnx -c Release --no-build --logger trx --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results

  extension:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint Firefox build
        run: npm run lint:firefox

  package-linux:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci')
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils dpkg-dev rpm wget desktop-file-utils file

      - name: Build packages
        run: scripts/build-linux-packages.sh "0.0.0-ci.${{ github.run_number }}" dist

      - name: Smoke test packages
        run: scripts/smoke-test-linux-packages.sh "0.0.0-ci.${{ github.run_number }}" dist

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juvin-linux-packages
          path: dist/*
          if-no-files-found: error

  package-windows:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci')
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build installer
        run: scripts/build-windows-installer.ps1 "0.0.0-ci.${{ github.run_number }}" dist

      - name: Smoke test installer
        run: scripts/smoke-test-windows-installer.ps1 "0.0.0-ci.${{ github.run_number }}" dist

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juvin-windows-installer
          path: dist/*
          if-no-files-found: error

  # CodeQL runs under the same gate. The findings go to the Security tab and the SARIF is
  # kept as an artifact as well; any error-level finding fails the job.
  codeql:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci')
    runs-on: ubuntu-24.04
    # The analyze step reads its own workflow run for the status report.
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          config-file: .github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          upload: always
          output: artifacts/codeql

      - name: Upload CodeQL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}
          path: artifacts/codeql

      - name: Fail on error-level findings
        shell: python
        run: |
          import glob, json, sys
          errors = 0
          for path in glob.glob("artifacts/codeql/*.sarif"):
              run = json.load(open(path))["runs"][0]
              rules = {r["id"]: r for r in run["tool"]["driver"].get("rules", [])}
              for ext in run["tool"].get("extensions", []):
                  rules.update({r["id"]: r for r in ext.get("rules", [])})
              for result in run.get("results", []):
                  if result.get("suppressions"):
                      continue
                  rule = rules.get(result["ruleId"], {})
                  level = result.get("level") or rule.get("defaultConfiguration", {}).get("level", "warning")
                  loc = result["locations"][0]["physicalLocation"] if result.get("locations") else {}
                  where = f'{loc.get("artifactLocation", {}).get("uri", "?")}:{loc.get("region", {}).get("startLine", "?")}'
                  print(f'{level}: {result["ruleId"]} at {where}: {result["message"]["text"]}')
                  errors += level == "error"
          sys.exit(1 if errors else 0)
