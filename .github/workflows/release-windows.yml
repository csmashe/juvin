# Builds the per-user Windows installer with Inno Setup and smoke-tests it with a silent install,
# a start of the app, and a silent uninstall. A pushed v* tag also attaches the installer to the
# draft GitHub release (shared with Release Linux); "Run workflow" builds and uploads the artifact only.
name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (MAJOR.MINOR.PATCH[-word[.number]]); defaults to the version in Directory.Build.props"
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    # Inno Setup 6 is preinstalled on the image.
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
          } elseif ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION
          } else {
            $version = [regex]::Match((Get-Content Directory.Build.props -Raw), '<Version[^>]*>([^<]*)</Version>').Groups[1].Value
          }
          $version = $version -replace '^v', ''
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[A-Za-z]+(\.(0|[1-9][0-9]*))?)?$') {
            Write-Output "::error::'$version' is not MAJOR.MINOR.PATCH with an optional -word or -word.number prerelease"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Juvin.slnx

      - name: Build
        run: dotnet build Juvin.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test Juvin.slnx -c Release --no-build

      - name: Build installer
        env:
          JUVIN_SENTRY_DSN: ${{ secrets.JUVIN_SENTRY_DSN }}
        run: scripts/build-windows-installer.ps1 "${{ steps.version.outputs.version }}" dist

      - name: Smoke test installer
        run: scripts/smoke-test-windows-installer.ps1 "${{ steps.version.outputs.version }}" dist

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juvin-windows-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    # Shared with the other release workflow so only one creates the draft; queue: max keeps a rerun
    # from cancelling the other platform's waiting job.
    concurrency:
      group: release-${{ github.ref_name }}
      queue: max
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: juvin-windows-${{ needs.package.outputs.version }}
          path: dist

      # Release Linux attaches to the same draft; whichever release job runs first creates it.
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! is_draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Juvin ${{ needs.package.outputs.version }}" --generate-notes
          elif [ "$is_draft" != true ]; then
            echo "::error::Release $GITHUB_REF_NAME is already published; refusing to replace its assets"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
