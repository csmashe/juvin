# Builds the Linux packages (deb, rpm, AppImage) and smoke-tests them in Ubuntu and Fedora
# containers. A pushed v* tag also creates a draft GitHub release with the packages attached;
# "Run workflow" builds and uploads the artifact only.
name: Release Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (MAJOR.MINOR.PATCH[-word[.number]]); defaults to the version in Directory.Build.props"
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
          elif [ -n "$INPUT_VERSION" ]; then
            version=$INPUT_VERSION
          else
            version=$(sed -n 's/.*<Version[^>]*>\(.*\)<\/Version>.*/\1/p' Directory.Build.props)
          fi
          version=${version#v}
          if ! [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[A-Za-z]+(\.(0|[1-9][0-9]*))?)?$ ]]; then
            echo "::error::'$version' is not MAJOR.MINOR.PATCH with an optional -word or -word.number prerelease"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils dpkg-dev rpm wget desktop-file-utils file

      - name: Restore
        run: dotnet restore Juvin.slnx

      - name: Build
        run: dotnet build Juvin.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test Juvin.slnx -c Release --no-build

      - name: Build packages
        run: scripts/build-linux-packages.sh "${{ steps.version.outputs.version }}" dist

      - name: Smoke test packages
        run: scripts/smoke-test-linux-packages.sh "${{ steps.version.outputs.version }}" dist

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juvin-linux-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: juvin-linux-${{ needs.package.outputs.version }}
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Juvin ${{ needs.package.outputs.version }}" --generate-notes
